<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bottle Game</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: space-around;
        margin-top: 250px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        margin-bottom: 25px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      span {
        padding: 5px 7px;
        border-radius: 5px;
        color: white;
        margin-top: 22px;
        width: 50px;
        text-align: center;
      }
      .ip {
        background-color: green;
      }
      .op {
        background-color: blue;
      }
      input {
        padding: 5px;
        border-radius: 5px;
        border: 2px solid;
        width: 250px;
      }
      #arr {
        color: green;
      }
      #arrOp {
        color: blue;
      }
      .btn {
        display: flex;
        justify-content: center;
      }
      button {
        background-color: orangered;
        border: none;
        padding: 5px 10px;
        color: white;
        border-radius: 5px;
        width: 80px;
        font: bold 18px normal;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <span class="ip">Input</span>
        <div class="col">
          <label for="arr">Array</label>
          <input
            type="text"
            id="arr"
            name="arr"
            value= '["ahmed", "islam", "sandra", "fatma", "ali"]'
          />
        </div>
      </div>
      <div class="row">
        <span class="op">Output</span>
        <div class="col">
          <label for="arrOp">Array</label>
          <input
            type="text"
            id="arrOp"
            name="arrOp"
            value="['sandra', 'ali']"
          />
        </div>
      </div>
    </div>
    <div class="btn">
      <button>Check</button>
    </div>

    <!-- Start Script -->
    <script>
      let input = document.getElementById("arr");
      let output = document.getElementById("arrOp");
      let btn = document.querySelector(".btn button");

      function random(arr) {
        let first = arr[Math.floor(Math.random() * arr.length)];
        let sec = arr[Math.floor(Math.random() * arr.length)];
        while (first === sec) {
            let sec = arr[Math.floor(Math.random() * arr.length)];
        }
        return [first, sec];
      }
      btn.addEventListener("click", function () {
        if (input.value === "") {
          alert("Please Enter Array!");
          return;
        }
        let arr = JSON.parse(input.value); // بتحول ال str >> arr
        let result = random(arr);
        output.value = JSON.stringify(result);  // arr >> str
      });
    </script>
  </body>
</html>
