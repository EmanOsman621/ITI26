<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX3</title>
  </head>
  <body>
    <script>
      let input = prompt("Enter String: ");
      if (input.trim() === "" || !input) {
        alert("Error! Enter the correct value");
      }else {
        let count = 0;
        for (let i = 0; i < input.length; i++) {
          if (input[i].toLowerCase() === "e") {
            count++;
          }
        }
        document.write(`<h3>Count number of 'e' ${count}</h3>`);
      }
    </script>
  </body>
</html>
