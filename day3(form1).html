<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <style>
      :root {
        --main-color: #00b37e;
      }
      body {
        background-color: #55717f;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }
      .container {
        background-color: #eee;
        border-radius: 6px;
        margin: 25px;
        overflow: hidden;
        width: 600px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }
      h1 {
        text-align: center;
        color: #4a4a4a;
        margin: 20px 0;
        font-size: 22px;
      }
      form {
        background-color: white;
        padding: 25px 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
      }
      .full-width {
        grid-column: span 2;
      }
      label {
        color: var(--main-color);
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"],
      select,
      textarea {
        padding: 10px 12px;
        border: 1px solid #dcdcdc;
        border-radius: 4px;
        font-size: 14px;
        color: #555;
        background-color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--main-color);
      }
      .inline-group {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-top: 5px;
        font-size: 14px;
        color: #444;
      }
      .inline-group label {
        color: #444;
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 0;
        cursor: pointer;
      }
      .range-wrapped {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
      }
      .range-wrapped input[type="range"] {
        flex-grow: 1;
      }
      .range-badge {
        background-color: var(--main-color);
        color: white;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: bold;
      }
      textarea {
        resize: vertical;
        height: 80px;
      }
      .footer {
        background-color: #f7f7f7;
        padding: 15px 30px;
        border-top: 1px solid #e0e0e0;
        text-align: right;
      }
      button {
        background-color: var(--main-color);
        padding: 10px 25px;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
      }
      button:hover {
        background-color: #009970;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Create Account</h1>
      <form action="" autocomplete="on">
        
        <div class="form-group">
          <label for="fname">First name *</label>
          <input id="fname" placeholder="enter your first name" name="fname" required />
        </div>

        <div class="form-group">
          <label for="lname">Last name</label>
          <input id="lname" placeholder="enter your last name" name="lname" />
        </div>

        <div class="form-group full-width">
          <label for="email">Email *</label>
          <input id="email" type="email" placeholder="enter your email" name="email" required />
        </div>

        <div class="form-group">
          <label for="pass">Password *</label>
          <input id="pass" type="password" placeholder="enter your password" required name="pass" />
        </div>

        <div class="form-group">
          <label for="conPass">Confirm Password *</label>
          <input id="conPass" type="password" placeholder="enter your password again" required name="conPass" />
        </div>

        <div class="form-group">
          <label>Gender:</label>
          <div class="inline-group">
            <label><input type="radio" name="gen" value="Male" /> Male</label>
            <label><input type="radio" name="gen" value="Female" /> Female</label>
          </div>
        </div>

        <div class="form-group">
          <label>Hobbies</label>
          <div class="inline-group">
            <label><input type="checkbox" name="hob" value="music" /> Music</label>
            <label><input type="checkbox" name="hob" value="sports" /> Sports</label>
            <label><input type="checkbox" name="hob" value="travel" /> Travel</label>
            <label><input type="checkbox" name="hob" value="Movies" /> Movies</label>
          </div>
        </div>

        <div class="form-group">
          <label for="income">Source of Income</label>
          <select id="income" name="income">
            <option>Employed</option>
            <option>Student</option>
            <option>Unemployed</option>
          </select>
        </div>

        <div class="form-group">
          <label for="range">Income</label>
          <div class="range-wrapped">
            <input type="range" name="range" id="range" min="0" max="100" value="20" />
            <span class="range-badge">20K</span>
          </div>
        </div>

        <div class="form-group">
          <label for="file">Upload Profile Picture</label>
          <input type="file" id="file" name="file" />
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" value="18" />
        </div>

        <div class="form-group full-width">
          <label for="bio">Bio</label>
          <textarea name="bio" id="bio"></textarea>
        </div>

      </form>

      <div class="footer">
        <button type="submit">Create</button>
      </div>
    </div>
  </body>
</html>
