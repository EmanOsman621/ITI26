<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fizz Buzz Game</title>
    <style>
      .container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin: 100px auto;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      span {
        padding: 5px 7px;
        border-radius: 5px;
        color: white;
        margin-top: 22px;
      }
      .ip {
        background-color: green;
      }
      .op {
        background-color: blue;
      }
      input {
        padding: 5px;
        border-radius: 5px;
        border: 2px solid;
      }
      #num {
        color: green;
      }
      #sen {
        color: blue;
      }
      .btn {
        display: flex;
        justify-content: center;
      }
      button {
        background-color: orangered;
        border: none;
        padding: 5px 10px;
        color: white;
        border-radius: 5px;
        width: 80px;
        font: bold 18px normal;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <span class="ip">Input</span>
        <div class="col">
          <label for="num">Number</label>
          <input type="text" id="num" name="num" />
        </div>
      </div>
      <div class="row">
        <span class="op">Output</span>
        <div class="col">
          <label for="sen">Sentence</label>
          <input type="text" id="sen" name="sen" />
        </div>
      </div>
    </div>
    <div class="btn">
      <button>Check</button>
    </div>

    <script>
      let number = document.getElementById("num");
      let sentence = document.getElementById("sen");
      let btn = document.getElementsByClassName("btn")[0];

      function fizzBuzz(num) {
      if(num % 5 === 0 && num % 3 === 0) {
          return "fizz buzz";
      }else if(num % 5 === 0 && num % 3 !== 0) {
          return "buzz";
      }else if(num % 5 !== 0 && num % 3 === 0) {
          return "fizz";
      }else {
          return "none";
      }
      }
      btn.addEventListener("click", function() {
          if(number.value === "") {
              alert("Please Enter a number!");
          }
          let result = fizzBuzz(Number(number.value));
          sen.value = `"${result}"`;
      })
    </script>
  </body>
</html>
