<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.1</title>
</head>
<body>

<script>
    let message = prompt("Enter Your Message: ");
    if(message) {
        for(let i = 1; i <= 6; i++) {
            document.write(`<h${i}> ${message} ${i} </h${i}>`)
        }
    }
</script>

</body>
